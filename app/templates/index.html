<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: radial-gradient(circle at top left, #1f1b3d, #09090b 70%);
        color: #ffffff;
        font-family: 'Inter', sans-serif;
        overflow: hidden;
    }

    /* Ambient background glow */
    body::before {
        content: '';
        position: absolute;
        width: 500px;
        height: 500px;
        background: rgba(99, 102, 241, 0.15);
        border-radius: 50%;
        filter: blur(120px);
        z-index: -1;
    }

    .card {
        width: 320px;
        padding: 45px 35px;
        text-align: center;
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 35px;
        box-shadow: 
            0 30px 60px rgba(0, 0, 0, 0.4), 
            inset 0 1px 0 rgba(255, 255, 255, 0.1);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;
    }

    .card h2 {
        margin: 0;
        font-weight: 600;
        font-size: 32px;
        background: linear-gradient(135deg, #ffffff, #a5b4fc);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: -0.5px;
    }

    .card p {
        margin: 0 0 15px 0;
        color: #9ca3af;
        font-size: 14px;
        font-weight: 300;
    }

    .mic {
        width: 100px;
        height: 100px;
        border: none;
        border-radius: 50%;
        font-size: 38px;
        cursor: pointer;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: 
            0 12px 30px rgba(99, 102, 241, 0.3), 
            inset 0 2px 0 rgba(255, 255, 255, 0.2);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .mic:hover {
        transform: translateY(-4px) scale(1.05);
        box-shadow: 
            0 20px 40px rgba(99, 102, 241, 0.4), 
            inset 0 2px 0 rgba(255, 255, 255, 0.2);
    }

    .mic:active {
        transform: translateY(0) scale(0.95);
    }

    .status {
        margin-top: 15px;
        color: #e5e7eb;
        font-size: 15px;
        font-weight: 400;
        letter-spacing: 0.5px;
        transition: color 0.3s;
    }

    .song {
        font-size: 13px;
        color: #a5b4fc;
        min-height: 20px;
        font-weight: 300;
        opacity: 0.8;
    }

    /* Premium pulsating listening state */
    .listening {
        background: linear-gradient(135deg, #ec4899, #f43f5e);
        animation: pulse 2s infinite cubic-bezier(0.4, 0, 0.2, 1);
    }

    .listening:hover {
        transform: scale(1);
    }

    @keyframes pulse {
        0% {
            transform: scale(0.95);
            box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.7);
        }
        70% {
            transform: scale(1.1);
            box-shadow: 0 0 0 25px rgba(244, 63, 94, 0);
        }
        100% {
            transform: scale(0.95);
            box-shadow: 0 0 0 0 rgba(244, 63, 94, 0);
        }
    }
</style>
</head>

<body>

<div class="card">
    <h2>Nova AI</h2>
    <p>Say a song name</p>

    <button id="mic" class="mic">🎙️</button>

    <div id="status" class="status">Tap microphone</div>
    <div id="song" class="song"></div>
</div>

<script>

const mic=document.getElementById("mic");
const status=document.getElementById("status");
const song=document.getElementById("song");

const SpeechRecognition=
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let youtubeTab=null;
let listening=false;

if(!SpeechRecognition){

    status.textContent=
        "Speech recognition unavailable";

    mic.disabled=true;

}else{

    const recognition=
        new SpeechRecognition();

    recognition.lang="en-US";
    recognition.continuous=false;
    recognition.interimResults=false;

    recognition.onstart=()=>{

        listening=true;

        mic.classList.add("listening");

        status.textContent=
            "Listening...";

    };

    recognition.onend=()=>{

        listening=false;

        mic.classList.remove("listening");

    };

    recognition.onerror=()=>{

        listening=false;

        mic.classList.remove("listening");

        status.textContent="Try again";

    };

    recognition.onresult=async(event)=>{

        const command=
            event.results[0][0]
            .transcript
            .trim();

        if(!command){

            status.textContent=
                "No song detected";

            return;

        }

        song.textContent=command;

        status.textContent=
            "Finding song...";

        try{

            const response=
                await fetch(
                    "/youtube/play",
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:JSON.stringify({
                            command:command
                        })
                    }
                );

            const data=
                await response.json();

            if(!data.success){

                status.textContent=
                    data.message ||
                    "Song not found";

                return;

            }

            if(!youtubeTab ||
               youtubeTab.closed){

                youtubeTab=
                    window.open(
                        data.url,
                        "NovaYouTube"
                    );

            }else{

                youtubeTab.location.href=
                    data.url;

                youtubeTab.focus();

            }

            status.textContent="Playing";

        }catch(error){

            console.error(error);

            status.textContent=
                "Server connection failed";

        }

    };

    mic.onclick=()=>{

        if(listening)
            return;

        try{

            recognition.start();

        }catch(error){

            console.log(error);

        }

    };

}

</script>

</body>
</html>
